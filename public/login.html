<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Mega Consultas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="top-bar"></div>

<main class="auth-page">
  <div class="auth-card">
    <h1>Entrar</h1>
    <p class="subtitle">Acesse sua conta para consultar débitos de veículos.</p>

    <p class="auth-error hidden" id="erro"></p>

    <form id="form-login" autocomplete="on">
      <div class="auth-field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="btn-entrar">Entrar</button>
    </form>

    <p class="auth-footer-note">Ainda não tem conta? <a href="/signup.html">Criar conta</a></p>
  </div>
</main>

<script src="login.js"></script>
</body>
</html>
